name: smoke-test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: php -v
      - run: python3 ./docs/dev-workflow/scripts/smoke-test.py
