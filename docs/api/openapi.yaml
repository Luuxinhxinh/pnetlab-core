openapi: 3.0.3
info:
  title: PNetLab Core API Specification
  description: OpenAPI 3.0 Contract for PNetLab V8 Frontend and Backend synchronization.
  version: 8.2.0
servers:
  - url: http://127.0.0.1:4010
    description: Mock API Server for Frontend Development
  - url: https://127.0.0.1
    description: Production Backend Appliance

paths:
  /api/health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: System health status
          content:
            application/json:
              example:
                code: 200
                status: success
                message: OK

  /api/auth:
    post:
      summary: Authenticate user session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: pnet
                html5:
                  type: integer
                  example: 0
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              example:
                code: 200
                status: success
                message: User authenticated (90013).
        '401':
          description: Invalid credentials
          content:
            application/json:
              example:
                code: 401
                status: unauthorized
                message: Invalid credentials (90002).

    get:
      summary: Get current authenticated user info
      responses:
        '200':
          description: User profile info
          content:
            application/json:
              example:
                code: 200
                status: success
                data:
                  username: admin
                  role: admin
                  email: admin@pnetlab.local
                  pod: 0

  /api/auth/logout:
    get:
      summary: Invalidate user session
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              example:
                code: 200
                status: success
                message: User logged out.

  /api/folders:
    get:
      summary: List all lab folders
      responses:
        '200':
          description: Folder tree
          content:
            application/json:
              example:
                code: 200
                status: success
                data:
                  folders:
                    - id: 1
                      name: CCNA Labs
                      path: /CCNA Labs
                    - id: 2
                      name: CCNP Enterprise
                      path: /CCNP Enterprise
                  labs:
                    - id: 101
                      name: BGP-Flapping-Lab.unl
                      path: /CCNA Labs/BGP-Flapping-Lab.unl
                      nodes_count: 6

  /api/list/templates:
    get:
      summary: List available device templates
      responses:
        '200':
          description: Templates list
          content:
            application/json:
              example:
                code: 200
                status: success
                data:
                  - template: cisco-iol
                    name: Cisco IOL Router
                    type: iol
                    icon: router.png
                  - template: linux
                    name: Ubuntu 24.04 Server
                    type: qemu
                    icon: linux.png
                  - template: docker-alpine
                    name: Alpine Linux Container
                    type: docker
                    icon: docker.png

  /api/labs/session/nodes:
    get:
      summary: Get all nodes in active lab session
      responses:
        '200':
          description: Node list
          content:
            application/json:
              example:
                code: 200
                status: success
                data:
                  "1":
                    id: 1
                    name: R1-Core
                    type: qemu
                    template: cisco-iol
                    status: 2
                    cpu: 1
                    ram: 1024
                    left: 240
                    top: 180
                  "2":
                    id: 2
                    name: R2-Edge
                    type: qemu
                    template: cisco-iol
                    status: 0
                    cpu: 1
                    ram: 1024
                    left: 540
                    top: 180

  /api/labs/session/nodes/start:
    post:
      summary: Start a node or multiple nodes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Node started successfully
          content:
            application/json:
              example:
                code: 200
                status: success
                message: Node started.

  /api/labs/session/nodes/stop:
    post:
      summary: Stop a node or multiple nodes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Node stopped successfully
          content:
            application/json:
              example:
                code: 200
                status: success
                message: Node stopped.

  # =========================================================================
  # Online Mode, Mini-Git & Personal Profile APIs (Slim 4 /api/v4)
  # =========================================================================
  /api/v4/user/profile:
    get:
      summary: Get user profile details (own or another user)
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Target username. If omitted, returns authenticated user.
      responses:
        '200':
          description: User profile and statistics
          content:
            application/json:
              example:
                code: 200
                status: success
                data:
                  username: admin
                  name: Nguyễn Văn Nam
                  email: admin@pnetlab.local
                  role: "0"
                  bio: Giảng viên An toàn thông tin
                  workspace: Default Workspace
                  stats:
                    repositories_count: 8
                    stars_count: 142
                    forks_count: 65
    put:
      summary: Update personal profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                bio:
                  type: string
                workspace:
                  type: string
      responses:
        '200':
          description: Profile updated successfully

  /api/v4/hub/fork:
    post:
      summary: Fork/Clone a lab into user personal repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_path]
              properties:
                source_path:
                  type: string
                  example: ccna-enterprise-ospf-multi-area.unl
                dest_name:
                  type: string
                  example: my-forked-lab.unl
      responses:
        '201':
          description: Lab successfully forked
          content:
            application/json:
              example:
                code: 201
                status: success
                data:
                  forked_from: ccna-enterprise-ospf-multi-area.unl
                  forked_to: admin/my-forked-lab.unl
                  absolute_path: /opt/unetlab/labs/admin/my-forked-lab.unl
                  message: Successfully forked

  /api/v4/hub/snapshot:
    post:
      summary: Create a Mini-Git snapshot checkpoint for a lab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, message]
              properties:
                path:
                  type: string
                  example: ccna-enterprise-ospf-multi-area.unl
                message:
                  type: string
                  example: Cột mốc 2 - Hoàn tất Area 0
      responses:
        '200':
          description: Snapshot saved
          content:
            application/json:
              example:
                code: 200
                status: success
                message: Snapshot commit saved
                data:
                  snapshot_id: 20261014_045939_46684be3
                  timestamp: "2026-10-14T04:59:39.658406"
                  message: Cột mốc 2 - Hoàn tất Area 0
                  author: admin

  /api/v4/hub/history:
    get:
      summary: Get Mini-Git snapshot history for a lab
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          example: ccna-enterprise-ospf-multi-area.unl
      responses:
        '200':
          description: Array of snapshots
          content:
            application/json:
              example:
                code: 200
                status: success
                data:
                  - snapshot_id: 20261014_045939_46684be3
                    message: Cột mốc 2 - Hoàn tất Area 0
                    author: admin
                    timestamp: "2026-10-14T04:59:39.658406"

  /api/v4/hub/rollback:
    post:
      summary: Rollback lab topology and configs to a prior snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, snapshot_id]
              properties:
                path:
                  type: string
                snapshot_id:
                  type: string
      responses:
        '200':
          description: Lab successfully restored to snapshot

  /api/v4/hub/export:
    post:
      summary: Package lab and startup configs into .pnetlabz TAR.GZ archive with SHA256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        '200':
          description: Lab packaged into archive
