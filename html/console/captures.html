<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNetLab Captures</title>
<style>
  /* Aggregator shell for Wireshark packet captures: a TOP tab strip (capture names
     are long: SRC node·port -> DST node·port) over a pane area where each capture
     runs in ITS OWN iframe (kept alive on switch). No left sidebar — the top tabs
     are the only switcher. Each capture is its own eve-wireshark RDP container, so a
     tab can be popped out into its own window. Glassy theme to match the console. */
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ddd;
               font: 14px/1.4 system-ui, sans-serif; }
  #capapp { display: flex; flex-direction: column; height: 100%; }
  /* Top tab strip (mirrors console.html .ctabs-bar). Tabs wrap onto further rows. */
  #captabs { display: flex; flex-wrap: wrap; gap: 2px; row-gap: 2px; padding: 4px 4px 0;
             flex: 0 0 auto; background: rgba(28,40,33,.55);
             -webkit-backdrop-filter: blur(10px) saturate(160%);
             backdrop-filter: blur(10px) saturate(160%);
             border-bottom: 1px solid rgba(255,255,255,.10); }
  .cap-tab { display: flex; align-items: center; gap: 6px; max-width: 320px;
             background: rgba(255,255,255,.04); color: #bbb;
             border: 1px solid rgba(255,255,255,.10); border-bottom: none;
             border-radius: 6px 6px 0 0; padding: 6px 10px; cursor: pointer;
             font-weight: 700; }
  .cap-tab.active { background: rgba(255,255,255,.10); color: #fff; }
  .cap-label { flex: 1 1 auto; min-width: 0; font-size: 12px; line-height: 1.2;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap-btn { flex: 0 0 auto; width: 18px; height: 18px; line-height: 16px; text-align: center;
             border-radius: 4px; color: #cfe; opacity: .6; font-weight: 400; }
  .cap-btn:hover { opacity: 1; background: rgba(255,255,255,.16); }
  .cap-pop:hover { color: #9cf; }
  .cap-close:hover { background: #a33; color: #fff; }
  .cap-empty { color: #777; padding: 8px 10px; font-size: 12px; }
  #cappanes { position: relative; flex: 1 1 auto; min-height: 0; }
  .cap-pane { position: absolute; inset: 0; }
  .cap-pane iframe { width: 100%; height: 100%; border: 0; background: #000; }
</style>
</head>
<body>
<div id="capapp">
  <div id="captabs"><div class="cap-empty">No captures yet.</div></div>
  <div id="cappanes"></div>
</div>

<script src="captures-init.js?v=e7e34a16"></script>
</body>
</html>
