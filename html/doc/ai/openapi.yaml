        Self-service (any authenticated user): myworkspace (own workspace
        path), change_password, set_html5 (console preference). Admin reads:
        users (user list incl. role, quotas, ext_auth flag), roles,
        permcatalog (the permission catalog roles are built from),
        extauth_get (external-authentication settings - secrets are
        redacted to set/unset booleans, never returned).
      parameters:
        - name: action
          in: query
          required: true
          description: One of the x-actions values.
    post:
      tags: [users]
      summary: User/role writes (dispatch via ?action=).
      description: |
        Admin-only: user_add / user_edit (fields incl. username, password,
