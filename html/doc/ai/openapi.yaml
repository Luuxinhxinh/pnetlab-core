# openapi.yaml — PNetLab REST API reference (hand-authored).
#
# Kept honest by scripts/gen-apidocs.py: the script extracts the live route
# table and every ?action= dispatch literal from the PHP source and FAILS the
# build when something here is missing (drift gate). Action-dispatch endpoints
# use the x-actions extension (flattened "object.action" pairs for the lab
# session fan-out) and x-objects for the read fan-out; the generator renders
# doc/ai/index.html from this file.
#
# Formatting contract (parsed by a deliberate stdlib-only YAML subset parser):
# plain block style, 2-space indents, | / >- block scalars, simple inline
# [a, b] lists, no anchors/aliases/flow mappings, no trailing comments.
openapi: 3.0.3
info:
  title: PNetLab REST API
  version: "27H1-v8.2"
  summary: HTTP interface of the PNetLab network-emulation appliance
  description: |
    Every interactive feature of the PNetLab web UI rides this same-origin
    REST surface, so anything the UI can do, a script or AI agent can do too.
    The surface has three layers:

    1. The core Slim application at /api/... (labs, nodes, networks, folders,
       templates, import/export, authentication).
    2. Per-feature sub-applications at /<app>/api.php?action=... (status,
       users, cluster, images, PKI, MCP administration, ...). These are plain
       PHP dispatchers keyed on an "action" request parameter.
    3. Lab-page helper endpoints at /pnq-*.php (live link statistics, per-node
       telemetry history, protocol overlays, packet watchers, ...) scoped to
       the caller's open lab session.

    Authentication is a session cookie: POST /api/auth with username/password
    sets an HttpOnly, Secure, SameSite=Strict "token" cookie which every other
    endpoint validates. The appliance is served over HTTPS only (HTTP 301s to
    HTTPS for non-loopback clients) and the cookie is Secure-flagged, so
    clients MUST talk https and keep a cookie jar.

    Two response envelopes exist, for historical reasons:
    - Engine envelope (most endpoints): {"code": int, "status":
      "success"|"fail"|"unauthorized", "message": str, "data": any}
    - Compatibility envelope (a few status/api.php actions): {"result": bool,
      "message": str, "data": any}
    A machine agent should key on the HTTP status first, then "status" or
    "result".

    A separate MCP (Model Context Protocol) endpoint at /mcp/ exposes the
    build-and-run surface as typed tools for AI agents; see mcp-tools.json
    and the MCP administration tag below.
servers:
  - url: /
    description: Same origin as the web UI (HTTPS)
components:
  securitySchemes:
    tokenCookie:
      type: apiKey
      in: cookie
      name: token
      description: |
        Session cookie set by POST /api/auth. HttpOnly + Secure +
        SameSite=Strict; expires with the engine session lifetime. All
        endpoints except /api/health, /api/auth (POST), the two
        /api/password-reset routes and /pnq-sysmon.php require it.
  schemas:
    EngineEnvelope:
      type: object
      description: Standard engine response envelope.
      properties:
        code:
          type: integer
          description: Mirrors the HTTP status code.
        status:
          type: string
          description: success, fail, forbidden or unauthorized.
        message:
          type: string
          description: "Human-readable text, often suffixed with an engine message id such as (90013)."
        data:
          description: Payload; shape depends on the endpoint.
    CompatEnvelope:
      type: object
      description: >-
        Compatibility envelope used by the dashboard-era actions of
        /status/api.php (getSystemInfo, getRunningNodes, getInfo,
        getClusterInfo, apiSet*).
      properties:
        result:
          type: boolean
        message:
          type: string
        data:
          description: Payload; shape depends on the action.
    AuthThrottle:
      type: object
      description: >-
        429 body returned by POST /api/auth when an IP exceeds 10 failed
        logins inside 300 s; blocked for 300 s, Retry-After header set.
      properties:
        code:
          type: integer
        status:
          type: string
        message:
          type: string
security:
  - tokenCookie: []
tags:
  - name: auth
    description: Login, logout and session introspection.
  - name: templates
    description: Node templates, template icons and per-template defaults.
  - name: folders
    description: Lab-folder tree management inside the labs root.
  - name: labs
    description: Lab files - create, clone, read, edit, move, delete.
  - name: lab-session
    description: >-
      Running-lab sessions - open/join/leave/destroy a session, read topology
      objects, and drive every canvas mutation through the object/action
      fan-out.
  - name: import-export
    description: Lab archive export/import and icon listing.
  - name: status
    description: "Host status, KSM/CPU toggles, network config, power, telemetry history (sub-app: /status/api.php)."
  - name: users
    description: "User and role management, self-service settings, external-authentication administration (sub-app: /users/api.php)."
  - name: mcp-admin
    description: "MCP server administration - status, settings, bearer tokens (sub-app: /mcp/api.php). The MCP protocol endpoint itself is /mcp/."
  - name: cluster
    description: "Satellite cluster membership and image sync (sub-app: /cluster/api.php)."
  - name: images
    description: "Image management - browse/upload/delete images, icon scan, device factory, ishare2 catalog (sub-apps: /images-manage/, /images-icons/, /devices-factory/, /ishare2/)."
  - name: lab-import
    description: "Bulk lab-archive import pipeline (sub-app: /import/api.php)."
  - name: pki
    description: "Lab PKI - certificate authorities, issuance, revocation (sub-app: /pki/api.php, admin-only)."
  - name: sdwan
    description: "SD-WAN controller-set builder job control (sub-app: /sdwan/api.php)."
  - name: branding
    description: "Appliance branding - logo and UI text overrides (sub-app: /branding/api.php)."
  - name: system
    description: "Maintenance helpers (sub-app: /system/api.php)."
  - name: node-errors
    description: "Node launch-failure classifier for the lab page (sub-app: /node-errors/api.php)."
  - name: lab-tools
    description: >-
      Lab-page helper endpoints (/pnq-*.php) - live link statistics, per-node
      telemetry, protocol overlays, packet watcher, Wi-Fi painter. All are
      scoped to the caller's own open lab session.
  - name: mail
    description: >-
      SMTP settings, editable email templates, and admin-initiated password
      resets - core Slim routes under /api/admin/mail and
      /api/admin/users/{pod}/password-reset, plus the two public
      unauthenticated routes under /api/password-reset used by the emailed
      set-password link.
  - name: audit
    description: Admin-only lab, node and authenticated-session audit history.
paths:
  /api/health:
    get:
      tags: [auth]
      summary: Liveness probe (no authentication).
      description: |
        Returns 200 with a tiny JSON body when the web tier and database are
        answering. Safe to poll; used by installers and load balancers.
      x-curl: |
        curl -sk https://<host>/api/health
  /api/admin/mail:
    get:
      tags: [mail]
      summary: Read SMTP settings and the three editable email templates.
      description: |
        Admin-only. Returns enabled/host/port/encryption/auth/username,
        password_set (the stored SMTP password is write-only - never
        returned), from_email/from_name, public_url (the HTTPS base used to
        build password-reset links), and templates.{welcome,request,test}
        (each {subject, body} - the built-in default until customized once).
      x-curl: |
        curl -sk -b jar.txt https://<host>/api/admin/mail
    put:
      tags: [mail]
      summary: Save SMTP settings.
      description: |
        Admin-only. Body: {enabled, auth, host, port, encryption
        ("none"|"ssl"|"tls"), username, from_email, from_name, public_url,
        password?}. password is optional and write-only - omit it (or send
        "") to keep the currently stored one; every other field is required
        on every save (an absent field is NOT treated as "leave unchanged").
        public_url must be an HTTPS origin with no path/query/credentials
        when non-empty. 400 on validation failure (bad host/port/encryption/
        email, or enabled=true without host+from_email, or auth=true without
        a resolvable username+password).
      x-curl: |
        curl -sk -b jar.txt -H 'Content-Type: application/json' \
          -X PUT -d '{"enabled":true,"auth":true,"host":"smtp.example.com",
          "port":587,"encryption":"tls","username":"noreply","password":"...",
          "from_email":"noreply@example.com","from_name":"PNETLab",
          "public_url":"https://pnetlab.example.com"}' \
          https://<host>/api/admin/mail
  /api/admin/mail/template/{kind}:
    put:
      tags: [mail]
      summary: Save one of the three editable email templates.
      description: |
        Admin-only. {kind} is "welcome" (account-creation "set your
        password" link), "request" (default Reset-password-button email, an
        existing user), or "test" (the Send-a-test-email fields' saved
        default). Body: {subject, body} (body is HTML; both required,
        non-blank). Placeholders {{username}}, {{link}}, {{hours}} are
        substituted server-side when the email is actually sent.
      parameters:
        - name: kind
          in: path
          required: true
          description: One of welcome, request, test.
      x-curl: |
        curl -sk -b jar.txt -H 'Content-Type: application/json' \
          -X PUT -d '{"subject":"Set your PNETLab password","body":"<p>Hi
          {{username}}...</p>"}' \
          https://<host>/api/admin/mail/template/welcome
  /api/admin/mail/test:
    post:
      tags: [mail]
      summary: Send a real test email through the saved SMTP settings.
      description: |
        Admin-only. Body: {to, subject?, body?} - subject/body default to
        the saved "test" template (or its built-in default) when omitted.
        502 with the underlying SMTP error text on delivery failure (bad
        auth, unreachable host, rejected recipient, ...).
      x-curl: |
        curl -sk -b jar.txt -H 'Content-Type: application/json' \
          -X POST -d '{"to":"you@example.com"}' \
          https://<host>/api/admin/mail/test
  /api/admin/activity:
    get:
      tags: [audit]
      summary: Read the audit log (lab/node activity and user sessions).
      description: |
        Admin-only. data.data is up to `limit` (max 200) rows newest-first,
        data.total is the full matching row count for pagination. categories
        is a comma-separated subset of lab, node, session (unrecognized
        values are ignored; an empty/all-unrecognized list falls back to all
        three). Session logout rows carry duration_seconds computed against
        that session's own login row (session_id, a hash of the session
        token - not just username, so concurrent sessions for one user don't
        cross-pair).
      parameters:
        - name: categories
          in: query
          required: false
          description: Comma-separated subset of lab, node, session.
        - name: limit
          in: query
          required: false
          description: Rows per page, 1-200 (default 100).
        - name: offset
          in: query
          required: false
          description: Row offset for paging (default 0).
      x-curl: |
        curl -sk -b jar.txt "https://<host>/api/admin/activity?categories=lab,node&limit=10"
  /api/admin/users/{pod}/password-reset:
    post:
      tags: [mail]
      summary: Issue and email a password-reset link for an existing user.
      description: |
        Admin-only. Generates a fresh single-use token (invalidating that
        user's older unused tokens), emails it using the "request" template,
        and returns {ok, email}. Does NOT change the user's current
        password - it stays valid until the emailed link is actually used.
        404 if the pod doesn't exist; 409 if the target account is
        directory-authenticated (RADIUS/LDAP - those must reset in the
        directory, not here); 502 with the SMTP error text on delivery
        failure (the token is still issued even if the email fails to send).
      parameters:
        - name: pod
          in: path
          required: true
          description: Target user's pod (tenant) id.
      x-curl: |
        curl -sk -b jar.txt -X POST https://<host>/api/admin/users/5/password-reset
  /api/password-reset/check:
    post:
      tags: [mail]
      security: []
      summary: Validate a password-reset token (public, unauthenticated).
      description: |
        No auth cookie required or checked. Body: {token}. The landing page
        keeps the emailed token in its URL fragment and sends it in this JSON
        body so it does not enter HTTP access logs. Returns {username} on a still-valid, unused,
        unexpired token, or 404 with an explanatory message otherwise (used
        already / expired / invalid). Read-only - does not consume the
        token.
      x-curl: |
        curl -sk -H 'Content-Type: application/json' \
          -X POST -d '{"token":"..."}' \
          https://<host>/api/password-reset/check
  /api/password-reset/consume:
    post:
      tags: [mail]
      security: []
      summary: Set a new password from a reset token (public, unauthenticated).
      description: |
        No auth cookie required or checked. Body: {token, password}.
        Atomically consumes the token (single-use - a concurrent second
        request with the same token cannot also succeed), sets the new
        password, and signs out that user's other active sessions. 400 on
        an invalid/expired/already-used token or a password that fails the
        minimum-length check.
      x-curl: |
        curl -sk -H 'Content-Type: application/json' \
          -X POST -d '{"token":"...","password":"a-new-password"}' \
          https://<host>/api/password-reset/consume
  /api/auth:
    get:
      tags: [auth]
      summary: Current session and user profile.
      description: |
        Returns the logged-in user's profile (username, role, pod/tenant id,
        html5 console preference, workspace folder, language table) in the
        engine envelope. 401 when the token cookie is missing or stale - use
        this as the cheap "am I still logged in?" probe. Query parameter
        "lang" selects the UI language table merged into data.lang.
      parameters:
        - name: lang
          in: query
          required: false
          description: Optional UI language code merged into the reply.
      x-curl: |
        curl -sk -b jar.txt https://<host>/api/auth
    post:
      tags: [auth]
      summary: Log in and receive the session cookie.
      description: |
        Body: {"username": str, "password": str, "html5": "0"|"1" (optional
        initial console preference)}. On success (200, message id 90013) the
        response sets the "token" cookie (HttpOnly, Secure, SameSite=Strict).
        Failure modes:
        - 401 (90002) invalid credentials - counts one failed attempt for the
          client IP.
        - 403 (90003..90006) correct password but the account is contained:
          not yet active, expired, outside its scheduled days, or disabled.
          Does NOT count against the throttle.
        - 429 (90007) the IP exceeded 10 failures in 300 s; blocked 300 s,
          Retry-After header carries the remaining seconds.
        - 503 (90020) the account is flagged for external authentication
          (RADIUS/LDAP), the directory is unreachable, and local-hash
          fallback is disabled. Not a credential failure - retry later or
          contact the administrator. No throttle strike.
        Accounts flagged external (users.ext_auth = radius|ldap) are verified
        against the configured directory; every other account authenticates
        against its local password hash.
      x-curl: |
        curl -sk -c jar.txt -H 'Content-Type: application/json' \
          -d '{"username":"admin","password":"..."}' \
          https://<host>/api/auth
  /api/auth/logout:
    get:
      tags: [auth]
      summary: Log out and clear the session cookie.
      description: |
        Invalidates the server-side session and expires the token cookie.
      x-curl: |
        curl -sk -b jar.txt https://<host>/api/auth/logout
  /api/list/templates/{template}:
    get:
      tags: [templates]
      summary: List node templates, or the form schema of one template.
      description: |
        Without a template slug: data maps every installed template slug to
        its display name; templates whose image is missing are suffixed
        ".missing". With a slug (e.g. iol, vios, docker): data.options is the
        add-node form schema (name, type, image list, cpu, ram, ethernet, and
        per-type extras) - the exact field set POST
        /api/labs/session/nodes/add accepts.
      parameters:
        - name: template
          in: path
          required: false
          description: Template slug; empty for the full template map.
      x-curl: |
        curl -sk -b jar.txt https://<host>/api/list/templates/
  /api/list/template-icons:
    get:
      tags: [templates]
      summary: List selectable node icons.
      description: |
        Returns the icon filenames under /opt/unetlab/html/images/icons that
        the node editor offers.
  /api/list/template-types:
    get:
      tags: [templates]
      summary: List the node type families.
      description: |
        Returns the engine's node type map (iol, qemu, docker, dynamips,
        vpcs).
  /api/templatedefaults/{template}:
    get:
      tags: [templates]
      summary: Read saved per-template form defaults.
      description: |
        Returns the admin-saved default values applied when the add-node form
        opens for this template.
    post:
      tags: [templates]
      summary: Save per-template form defaults.
      description: |
        Body is the field/value map to preset. Admin only.
    delete:
      tags: [templates]
      summary: Reset per-template form defaults.
      description: |
        Removes the stored defaults for the template. Admin only.
  /api/list/networks:
    get:
      tags: [templates]
      summary: List network/cloud types available to the caller.
      description: |
        Admins see every network type including host-bridged clouds
        (pnetN/bridge interfaces); non-admin users get the restricted list.
  /api/folders:
    get:
      tags: [folders]
      summary: List a folder of the labs tree.
      description: |
        Query parameter "path" (default "/") selects the folder. data
        contains "folders" and "labs" arrays. Non-admin users are jailed to
        their own workspace subtree.
      parameters:
        - name: path
          in: query
          required: false
          description: Folder path relative to the labs root.
      x-curl: |
        curl -sk -b jar.txt 'https://<host>/api/folders?path=/'
  /api/folders/{action}:
    post:
      tags: [folders]
      summary: Create, rename/move or delete a folder.
      description: |
        add - body {"name": str, "path": parent}; edit - body {"path": old,
        "new_path": new}; delete - body {"path": str}. Permission-gated per
        role (add/edit/delete folder permissions).
      parameters:
        - name: action
          in: path
          required: true
          description: One of the x-actions values.
    x-actions:
      - add
      - delete
      - edit
  /api/labs:
    post:
      tags: [labs]
      summary: Create a new lab, or clone an existing one.
      description: |
        Create - body {"path": folder, "name": str, "version": str,
        "description": str, "body": str}. Clone - body {"source":
        "/Folder/Lab.unl", "name": new-name}; presence of "source" selects
        the clone path. Returns the new lab in data.
      x-curl: |
        curl -sk -b jar.txt -H 'Content-Type: application/json' \
          -d '{"path":"/","name":"demo","version":"1"}' \
          https://<host>/api/labs
    delete:
      tags: [labs]
      summary: Delete a lab file.
      description: |
        Body {"path": "/Folder/Lab.unl"}. Also removes a corrupt lab file
        that can no longer be parsed.
  /api/labs/{action}:
    post:
      tags: [labs]
      summary: Read or modify one lab file.
      description: |
        Body always carries {"path": "/Folder/Lab.unl"} plus per-action
        fields. get - lab metadata; preview - one-shot bundle of labinfo +
        nodes + networks + text objects + lines (what the preview pane
        renders); edit - body.data carries the changed lab attributes
        (name, description, body, version, ...); move - body.new_path is the
        destination folder.
      parameters:
        - name: action
          in: path
          required: true
          description: One of the x-actions values.
    x-actions:
      - edit
      - get
      - move
      - preview
  /api/labs/session/factory/{action}:
    post:
      tags: [lab-session]
      summary: Lab-session lifecycle (open/join/leave/destroy/stop).
      description: |
        create - body {"path": "/Folder/Lab.unl"}; opens (or re-opens) a
        session for the lab and points the caller's account at it. join -
        body {"lab_session": id} joins a shared session. leave - leaves the
        caller's current session. destroy - body {"lab_session": id} tears
        the session down (stops its nodes, frees resources); also repairs
        half-broken sessions. stopNodes - body {"lab_session": id} stops all
        nodes but keeps the session. Resource limits (per-user CPU/RAM caps,
        running-node limits) are enforced on create/start.
      parameters:
        - name: action
          in: path
          required: true
          description: One of the x-actions values.
      x-curl: |
        curl -sk -b jar.txt -H 'Content-Type: application/json' \
          -d '{"path":"/demo.unl"}' \
          https://<host>/api/labs/session/factory/create
    x-actions:
      - create
      - destroy
      - join
      - leave
      - stopNodes
  /api/labs/session/{object}:
    get:
      tags: [lab-session]
      summary: Read one object family of the caller's open lab session.
      description: |
        The read fan-out of the lab page. object selects what is returned
        (see x-objects): info - lab metadata; topology - the full canvas
        bundle; nodes - node list with status, console host/port and url;
        networks - network list; links - wiring; interfaces /
        networkints / interface - per-node and per-network interface detail
        (query: id); configs - saved startup-configs; textobjects /
        pictures / picturemapped / picturedata - canvas annotations (query:
        id where applicable); line - drawn line objects; workbook - workbook
        pages; tasks - the kind="task" view of workbook storage (optional
        query: name); wireshark - capture definitions; multi_cfg_list /
        multi_cfg_detail - config sets; portcheck - console-port
        reachability; console_guac_link - HTML5 console link mint; html -
        rendered lab description. Most object families accept an "id" query
        parameter to select a single element. GET /api/labs/session/tasks with
        no name returns {"message":{"tasks":[{"id":"Configure the OSPF
        underlay","weight":"1723486210001"}],"can_edit":true}; with
        name=... it returns {"message":{"id":"Configure the OSPF
        underlay","weight":"1723486210001","html":"<h2>...</h2>"}}.
        validation returns separate YAML-backed validation activities, node
        bindings, legacy task references, author capability, and the caller's
        persisted check results and weighted completion. It never modifies
        embedded text tasks or includes definitions in existing lab ZIPs.
      parameters:
        - name: object
          in: path
          required: true
          description: One of the x-objects values.
        - name: id
          in: query
          required: false
          description: Element id, where the object family supports it.
        - name: name
          in: query
          required: false
          description: Task title for GET /api/labs/session/tasks.
      x-curl: |
        curl -sk -b jar.txt https://<host>/api/labs/session/nodes
    x-objects:
      - configs
      - console_guac_link
      - html
      - info
      - interface
      - interfaces
      - line
      - links
      - multi_cfg_detail
      - multi_cfg_list
      - networkints
      - networks
      - nodes
      - picturedata
      - picturemapped
      - pictures
      - portcheck
      - textobjects
      - topology
      - tasks
      - validation
      - wireshark
      - workbook
  /api/labs/session/{object}/{action}:
    post:
      tags: [lab-session]
      summary: Mutate the caller's open lab session (object/action fan-out).
      description: |
        The write fan-out of the lab page: object picks the family, action
        the operation (flattened "object.action" pairs in x-actions). The
        important families for an agent:
        - nodes: add (body = the template form fields from
          /api/list/templates/{t} plus left/top), edit, delete, start, stop,
          shutdown, wipe, export (save running-config back into the lab),
          hibernate, freeze, isolate, lock/unlock, port/port_2nd (console
          port reassignment). start/stop/etc take {"id": node-id}.
          commit takes {"id", "mode"} and persists a STOPPED qemu node's disk
          overlay: mode=commit folds it into the shared base image every other
          lab is linked-cloned from (destructive, retroactive), mode=save_as
          additionally takes {"dest"} and writes a NEW image under
          addons/qemu/<dest> instead, leaving the base untouched. Admin only —
          both write appliance-global state. Fails if the node is running.
        - networks: add/edit/delete a cloud/bridge; p2p (body src_id,
          src_if, dest_id, dest_if) wires two nodes point-to-point in one
          call.
        - interfaces: edit connects/disconnects node interfaces (body id +
          interface map); setquality applies WAN impairment (delay, jitter,
          loss, rate) to a link; setSuspend / setSuspendtwo_way
          administratively suspend one or both directions; style/styles
          persist link styling.
        - configs.edit saves a node startup-config (body id, data).
        - lab.lock / lab.unlock toggle the lab's edit lock.
        - textobjects / pictures / line: canvas annotations.
        - workbook: guided-workbook page management.
        - validation: additional task checks stored outside lab XML. save takes
          {base_revision,tasks}; import takes {base_revision,yaml,node_mapping}
          with optional explicit node mapping; export returns {filename,mime,yaml}.
          import with preview:true returns proposed node bindings without saving.
          save and non-preview import require EDIT_TASKS and an unlocked lab; export requires
          EDIT_TASKS. run takes {check_id}, executes one bounded check against
          the caller's lab node, and persists a server-derived result and score.
          Learners can run checks and inspect failed evidence but cannot submit
          pass/fail state or author definitions. Stale revisions fail with 409.
          Every check is explicitly user-triggered; opening the panel runs none.
        - tasks: instructor-authored task management, backed by kind="task"
          workbook entries. Every task action requires EDIT_TASKS and an
          unlocked open lab. Bodies and successful responses are:
          add {"name":"Configure the OSPF underlay"} -> {"message":""};
          delete {"name":"Configure the OSPF underlay"} -> {"message":""};
          edit {"name":"Configure the OSPF underlay","new_name":"Configure
          OSPF Area 0"} -> {"message":""}; order
          {"src_name":"Task A","dest_name":"Task B"} -> {"message":""};
          update {"name":"Configure the OSPF underlay","content":"<h2>Objective</h2>"}
          -> {"message":{"id":"Configure the OSPF underlay","html":"<h2>Objective</h2>"}}.
          Task titles are 1-160 Unicode letters/digits/whitespace plus
          _-.,:;'"()&/; content is sanitized to a rich-text subset (headings,
          lists, tables, dividers, links, inline emphasis) and capped at
          256 KB after sanitization.
        - wireshark: capture definitions - add, capture (start a capture),
          delete, focus, wifiview.
        - multi_cfg: named config sets - add, active, edit, rename, delete,
          import, export.
        - ai: the in-app agent assist - access, progress, plan, build.
        - sdwan: versions/build of the SD-WAN controller-set factory.
        - background.edit: canvas background flags (darkmode, 3D, grid).
        All actions require an open session (factory/create first) and lab
        edit permission for mutations; the lab lock refuses writes while
        locked.
      parameters:
        - name: object
          in: path
          required: true
          description: Object family (first token of the x-actions pairs).
        - name: action
          in: path
          required: true
          description: Operation (second token of the x-actions pairs).
      x-curl: |
        curl -sk -b jar.txt -H 'Content-Type: application/json' \
          -d '{"id":1}' \
          https://<host>/api/labs/session/nodes/start
