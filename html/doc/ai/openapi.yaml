        flag an account for external authentication), user_delete, role_add /
        role_edit / role_delete (custom roles from the permission catalog),
        extauth_set (external-auth settings write - accepts radius.secret /
        ldap.bind_pw on input only; they land in a root-only config via the
        privilege broker), extauth_test (live directory test with a
        username/password; returns diagnostics, never secrets).
      x-curl: |
        curl -sk -b jar.txt -H 'Content-Type: application/json' \
          -d '{"proto":"ldap","username":"u","password":"p"}' \
          'https://<host>/users/api.php?action=extauth_test'
    x-actions:
