---
type: docker
config_script: config_srlinux.py
description: Nokia SRLinux IRXD3L
name: SRL
cpulimit: 1
icon: Router-2D-Nokia-SROS-S.svg
ethernet: 8
eth_format: ethernet-1/{1}
eth_name:
  - mgmt0
console: telnet
cpu: 4
ram: 4096
disable_offload: 1
mtu: 9500
init: init_srlinux-ixr-d3l.sh
dock_args: -u 0:0 --device /dev/fuse  --cap-add=SYS_ADMIN --cap-add=NET_ADMIN  --net=none --shm-size 1G --privileged
dock_cmd: sudo bash -c 'sleep 5 ; bash /sr_linux_init.sh'
docker_shell: pgrep sr_linux 1>/dev/null && echo Press Enter to start CLI && read -r && sr_cli ||  ( echo waiting system  && sleep 10 )
...
