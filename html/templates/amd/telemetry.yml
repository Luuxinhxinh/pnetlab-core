# PNetLab "Telemetry Lab" node — gnmic (dial-in gNMI SUBSCRIBE + optional
# dial-out LISTEN tcp/57400) + mosquitto (MQTT tcp/1883) + Redpanda (Kafka
# tcp/9092, best-effort) + a self-contained Go web GUI on :80 with live
# Interfaces/BGP/System telemetry dashboards, raw stream tail, and MQTT/Kafka
# tabs. Image: pnet-telemetry (offline-install via the Dashboard Docker
# Devices page).
# console: http -> device_docker's GUI-docker path publishes container port 80
# as the node console (native http routing since engine 6.8.43). Leave
# dock_args EMPTY so device_docker takes that path (adds --net=bridge -p
# <host>:80 + the busybox-managed lab interface). Per-interface networking
# (DHCP / static IP) is set in the normal node edit; all services bind
# 0.0.0.0 so lab routers reach them over eth1. Template stem "telemetry" is a
# substring of the image name (engine binds template -> image via
# docker images | grep). config_script keeps the run LED working and pushes
# the Startup-config blob (/firstboot.cfg) in.
type: docker
config_script: config_aaa.py
name: Telemetry Lab
description: Telemetry Lab (gNMI/OpenConfig + MQTT + Kafka)
cpulimit: 1
icon: SDWAN-2D-Versa-Analytic-S.svg
ethernet: 2
console: http
console_2nd: telnet
cpu: 2
ram: 4096
mtu: 1500
docker_shell: 'echo "Telemetry Lab -- configure via the http console GUI (admin/pnet)."; echo "gNMI dial-in SUBSCRIBE targets: add on the Devices tab. Dial-out LISTEN: Nokia SR OS only (upstream)."; echo "MQTT: mosquitto tcp/1883. Kafka: Redpanda tcp/9092 (best-effort)."; echo "--- /firstboot.cfg ---"; cat /firstboot.cfg 2>/dev/null; exec /bin/bash'
