# Lab-platform template for the Yersinia L2 Attacks docker node.
# Goes to /opt/unetlab/html/templates/{amd,intel}/yersinia.yml.
# Filename stem "yersinia" must stay a substring of the image name
# (pnet-yersinia) — the engine binds template->image via
# `docker images | grep <stem>`.
#
# console: vnc  -> the engine publishes container port 5900 and guacd renders
#                  the native Yersinia GTK desktop in the browser console.
#                  No map_port needed (VNC console port is fixed, not the web 80).
# ethernet: 2   -> eth0 = mgmt/console (docker bridge, auto; non-connectable on canvas),
#                  eth1 = lab data. The platform assigns eth1's IP; needs 2 NICs so
#                  eth1 is an actual selectable data port (eth0 is disabled as mgmt).
#                  The platform assigns eth1's IP; the node never self-assigns it.
# docker_options -> CAP_NET_RAW (raw L2 send: STP/CDP/DHCP/DTP/HSRP/802.1Q/VTP/
#                  MPLS frames) + CAP_NET_ADMIN (promiscuous + iface control).
#                  Neither is in docker's default capability set.
---
type: docker
name: Yersinia L2 Attacks
description: Yersinia L2 Attacks
cpulimit: 2
cpu: 2
ram: 2048
ethernet: 2
console: vnc
config_script: config_aaa.py
icon: Firewall-2D-Generic-S.svg
docker_options: --cap-add=NET_ADMIN --cap-add=NET_RAW
shutdown: 1
