---
type: qemu
config_script: config_cat9kv.py
init: init_cat9kv.sh
prep: prep_cat9kv.sh
name: C9K
description: Cisco Catalyst 9000v
cpulimit: 1
icon: Switch-2D-Cat9k-Blue-S.svg
cpu: 4
ram: 18432
ethernet: 9
eth_name:
- G0/0
eth_format: G1/0/{1}
console: telnet
qemu_arch: x86_64
# 5.2.0 (legacy zoo build) cannot boot the CML-era 17.x images: GRUB dies
# with "error: invalid magic number" loading the kernel from packages.conf.
# Proven on the .189 re-gate: identical disk boots clean on 9.2.4.
# e1000 boots but the ASIC sim NEVER transmits a frame (ports "connected",
# zero egress). Proven on the .189 re-gate: virtio dataplane comes up
# (LINEPROTO up + real egress). vrnetlab/containerlab use virtio too.
qemu_nic: virtio-net-pci
qemu_options: -machine type=pc,accel=kvm -vga std -usbdevice tablet -boot order=cd -cdrom config.iso
...
