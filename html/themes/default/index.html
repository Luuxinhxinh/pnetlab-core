	<!-- client state store (single source of truth) — must load BEFORE the
	     topology stub below: the stub's installWindowNodes() calls
	     window.PNQStore.subscribe(...) synchronously at install time (via the
	     top-level installStub() call in that file), guarded by
	     `if (window.PNQStore && ...)`. With the store loading later, that guard
	     always failed silently and window.nodes never wired up to live PNQStore
	     changes — it only ever reflected whatever existed at initial page load.
	     A "re-assert on DOMContentLoaded" fallback in the stub was meant to catch
	     this, but is itself blocked by the stub's own idempotency guard, so it
	     never actually re-ran the subscribe. Net effect: any node added mid-
	     session (Add Node dialog) never appeared in window.nodes, so the
	     quickbar's Start All / Stop All / Wipe All / Console All buttons (which
	     iterate Object.keys(window.nodes)) silently skipped it — while the
	     per-node hover-action-bar buttons kept working, since those read
	     PNQStore directly. Loading the store first fixes this at the source. -->
	<script src="/themes/default/js/pnetlab-store.js?v=2f5ca983" defer></script>
